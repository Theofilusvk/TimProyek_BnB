<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemilihan Tim Proyek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- judul halaman -->
    <header>
      <h1>Pemilihan Tim Proyek</h1>
      <p class="subtitle">Optimasi dengan algoritma Branch &amp; Bound</p>
    </header>

    <!-- form input data -->
    <div class="card">
      <h2>Input Data</h2>

      <!-- tombol preset ukuran kandidat -->
      <div class="preset-group">
        <span class="preset-label">Preset Ukuran:</span>
        <button id="btn-small"  class="btn-preset" onclick="applyPreset(12)">Small (n=12)</button>
        <button id="btn-medium" class="btn-preset" onclick="applyPreset(18)">Medium (n=18)</button>
        <button id="btn-large"  class="btn-preset" onclick="applyPreset(24)">Large (n=24)</button>
        <div style="width: 1px; height: 20px; background: #cbd5e1; margin: 0 8px;"></div>
        <input type="file" id="file-upload" accept=".csv, .xlsx, .xls" style="display: none;" onchange="handleFileUpload(event)">
        <button class="btn-preset" style="background: #e6f4ed; border-color: #1a7a4a; color: #1a7a4a;" onclick="triggerUpload()">📥 Import Excel/CSV</button>
      </div>

      <div class="form-grid">
        <!-- input jumlah kandidat, saat diisi langsung generate kotak biaya -->
        <div class="form-group">
          <label for="n">Jumlah Kandidat <span class="hint-inline">(n ≥ 12)</span></label>
          <input type="number" id="n" min="12" placeholder="contoh: 12" oninput="generateCandidateInputs()">
        </div>

        <!-- input ukuran tim -->
        <div class="form-group">
          <label for="k">Ukuran Tim <span class="hint-inline">(5 ≤ k ≤ 10)</span></label>
          <input type="number" id="k" min="5" max="10" placeholder="contoh: 5">
        </div>

        <!-- input batas anggaran -->
        <div class="form-group full-width">
          <label for="budget">Batas Anggaran (B) <span class="hint-inline">(integer > 0)</span></label>
          <input type="number" id="budget" min="1" placeholder="contoh: 400">
        </div>
      </div>

      <!-- kotak input biaya tiap kandidat, muncul otomatis sesuai n -->
      <div class="form-group" style="margin-top: 16px;" id="candidate-section" style="display:none;">
        <label>Biaya Tiap Kandidat <span class="hint-inline">(c[i], integer)</span></label>
        <div id="candidate-inputs" class="candidate-grid"></div>
      </div>

      <!-- tombol aksi -->
      <div class="btns">
        <button id="btn-solve" class="btn-primary" onclick="solve()">Jalankan B&amp;B</button>
        <button id="btn-reset" class="btn-secondary" onclick="resetForm()">Reset</button>
      </div>
    </div>

    <!-- hasil yang ditampilkan -->
    <div id="hasil"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
