<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pemilihan Tim Proyek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- judul halaman -->
    <header>
      <h1>Pemilihan Tim Proyek</h1>
      <p class="subtitle">Optimasi dengan algoritma Branch &amp; Bound</p>
    </header>

    <!-- form input data -->
    <div class="card">
      <h2>Input Data</h2>

      <div class="form-grid">
        <!-- input jumlah kandidat, saat diisi langsung generate kotak biaya -->
        <div class="form-group">
          <label for="n">Jumlah Kandidat <span class="hint-inline">(n ≥ 12)</span></label>
          <input type="number" id="n" min="12" placeholder="contoh: 12" oninput="generateCandidateInputs()">
        </div>

        <!-- input ukuran tim -->
        <div class="form-group">
          <label for="k">Ukuran Tim <span class="hint-inline">(5 ≤ k ≤ 10)</span></label>
          <input type="number" id="k" min="5" max="10" placeholder="contoh: 5">
        </div>

        <!-- input batas anggaran -->
        <div class="form-group full-width">
          <label for="budget">Batas Anggaran (B)</label>
          <input type="number" id="budget" placeholder="contoh: 400">
        </div>
      </div>

      <!-- kotak input biaya tiap kandidat, muncul otomatis sesuai n -->
      <div class="form-group" style="margin-top: 16px;">
        <label>Biaya Tiap Kandidat</label>
        <div id="candidate-inputs" class="candidate-grid"></div>
      </div>

      <!-- tombol aksi -->
      <div class="btns">
        <button class="btn-primary" onclick="solve()">Jalankan B&amp;B</button>
      </div>
    </div>

    <!-- hasil yang ditampilkan-->
    <div id="hasil"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
